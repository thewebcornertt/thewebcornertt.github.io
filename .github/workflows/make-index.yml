name: Make index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  make-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy full site to index.html
        run: |
          cp thewebcorner.html index.html
          git config user.name "thewebcornertt"
          git config user.email "thewebcornertt@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Replace index.html with the full site"
          git push
